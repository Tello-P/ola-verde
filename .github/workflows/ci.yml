name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests del core y backend (H2)
        run: ./gradlew :core:test :backend:test --console=plain
      - name: Compilar app Android
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ov
          POSTGRES_PASSWORD: ov
          POSTGRES_DB: ov
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests del backend contra PostgreSQL
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ov
          TEST_DATABASE_USER: ov
          TEST_DATABASE_PASSWORD: ov
        run: ./gradlew :backend:test --console=plain
